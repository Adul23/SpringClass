spring:
  application:
    name: spring_class

  profiles:
    active: dev

  cache:
    type: caffeine
    cache-names: task, taskPages
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    defer-datasource-initialization: false
    show-sql: true

  logging:
    level:
      com.example: DEBUG
      timing: DEBUG

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations:
      - classpath:db/migration
      - classpath:db/demo

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

  http:
    clients:
      connect-timeout: 1s
      read-timeout: 2s

app:
  name: spring_class
  max-users: 100

holidays:
  base-url: https://date.nager.at