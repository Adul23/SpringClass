server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/demo_db
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}

  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/demo

app:
  message: Hello from TEST
  debug-enabled: false

springdoc:
  swagger-ui:
    enabled: false